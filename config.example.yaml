# Prenotami Booker Configuration
# Copy this to config.yaml and fill in your details.
# Credentials can also be set via environment variables (see .env.example).

# Prenot@mi portal credentials
prenotami:
  email: "your-email@example.com"
  password: "your-prenotami-password"

# Email settings for OTP retrieval (IMAP)
email:
  imap_server: "imap.gmail.com"
  imap_port: 993
  email: "your-email@example.com"
  # password: "your-email-app-password"
  use_ssl: true
  use_oauth: true

# Optional success/failure notifications
notification:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  smtp_email: "your-email@example.com"
  smtp_password: "your-email-app-password"
  notify_email: "your-email@example.com"
  use_tls: true

# Release schedule: midnight in Rome, Monday through Thursday.
# The timezone-aware scheduler converts this to UTC automatically,
# including daylight-saving changes in Europe/Rome.
consulate:
  name: "Prenot@mi"
  release_days:
    - "monday"
    - "tuesday"
    - "wednesday"
    - "thursday"
  release_time: "00:00"
  timezone: "Europe/Rome"
  timing_offset_seconds: -2
  calendar_months_ahead: 3
  otp_prefetch_seconds: 120
  service_type: "citizenship"

# Browser settings for the server
browser:
  headless: true
  browser: "chrome"
  implicit_wait: 10
  page_load_timeout: 30
